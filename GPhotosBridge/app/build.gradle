plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bridge.gphotos'
    compileSdk 34

    defaultConfig {
        applicationId "com.bridge.gphotos"
        minSdk 24
        targetSdk 29 // Targets Android 10 Legacy Storage for direct, frictionless DCIM/GPhotos file writes on Pixel XL
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}